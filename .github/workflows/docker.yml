name: Docker

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Check tag, crate versions and changelog
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            bash scripts/check-release.sh "$REF_NAME"
          else
            bash scripts/check-release.sh
          fi

  ci:
    name: CI
    needs: release-metadata
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push
    needs: [release-metadata, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify unprivileged runtime image
        run: |
          grep -F "groupadd --gid 10001 nox" Dockerfile
          grep -F "install -d -o 0 -g 0 -m 0755 /etc/nox" Dockerfile
          grep -F "install -d -o 10001 -g 10001 -m 0750 /var/lib/nox" Dockerfile
          grep -F "USER 10001:10001" Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: NOX_BUILD_HASH=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: build-and-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          version=${TAG#v}
          {
            bash scripts/release-notes.sh "$version"
            printf '\n## Image\n\n'
            printf -- '- `%s:%s`\n' "$IMAGE" "$version"
            printf -- '- `%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- Commit `%s`\n' "$SHA"
          } > "$RUNNER_TEMP/notes.md"

          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "nox $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          else
            gh release create "$TAG" --verify-tag --title "nox $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi
