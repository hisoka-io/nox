name: NOX CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # .cargo/config.toml builds for the local CPU. Runners differ, so cached artifacts built with
  # target-cpu=native can hit SIGILL on another runner. Pin a baseline every runner supports.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify unprivileged runtime image
        run: |
          grep -F "groupadd --gid 10001 nox" Dockerfile
          grep -F "install -d -o 0 -g 0 -m 0755 /etc/nox" Dockerfile
          grep -F "install -d -o 10001 -g 10001 -m 0750 /var/lib/nox" Dockerfile
          grep -F "USER 10001:10001" Dockerfile
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check RustSec exception deadlines
        run: bash scripts/check-rustsec-exceptions.sh
      - name: Clippy (production code)
        run: cargo clippy --workspace --features dev-node --exclude nox-sim --exclude nox-test-infra --lib --bins -- -D warnings
      - name: Clippy (test & bench code - relaxed for test ergonomics)
        run: |
          cargo clippy --workspace --features dev-node --exclude nox-mixnet --exclude nox-sim --exclude nox-test-infra --tests --benches -- \
            -D warnings \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::semicolon_if_nothing_returned \
            -A clippy::doc_markdown \
            -A clippy::needless_pass_by_value \
            -A clippy::float_cmp \
            -A clippy::bool_to_int_with_if \
            -A clippy::uninlined_format_args \
            -A clippy::redundant_closure_for_method_calls \
            -A clippy::panic \
            -A clippy::match_wildcard_for_single_variants \
            -A clippy::unreadable_literal \
            -A clippy::manual_let_else \
            -A clippy::needless_range_loop \
            -A clippy::explicit_auto_deref \
            -A clippy::explicit_iter_loop \
            -A clippy::vec_init_then_push \
            -A clippy::large_digit_groups \
            -A clippy::io_other_error \
            -A clippy::allow_attributes_without_reason \
            -A clippy::ignore_without_reason \
            -A clippy::manual_assert \
            -A clippy::let_unit_value \
            -A clippy::ignored_unit_patterns
      # The root crate's tests/ and benches/ were never linted before. Same relaxations as above, plus the
      # style lints they still trip; drop these once the files are cleaned up.
      - name: Clippy (root integration tests & benches)
        run: |
          cargo clippy -p nox-mixnet --features dev-node --tests --benches -- \
            -D warnings \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::semicolon_if_nothing_returned \
            -A clippy::doc_markdown \
            -A clippy::needless_pass_by_value \
            -A clippy::float_cmp \
            -A clippy::bool_to_int_with_if \
            -A clippy::uninlined_format_args \
            -A clippy::redundant_closure_for_method_calls \
            -A clippy::panic \
            -A clippy::match_wildcard_for_single_variants \
            -A clippy::unreadable_literal \
            -A clippy::manual_let_else \
            -A clippy::needless_range_loop \
            -A clippy::explicit_auto_deref \
            -A clippy::explicit_iter_loop \
            -A clippy::vec_init_then_push \
            -A clippy::large_digit_groups \
            -A clippy::io_other_error \
            -A clippy::allow_attributes_without_reason \
            -A clippy::ignore_without_reason \
            -A clippy::manual_assert \
            -A clippy::let_unit_value \
            -A clippy::ignored_unit_patterns \
            -A clippy::duration_suboptimal_units \
            -A clippy::default_trait_access \
            -A clippy::needless_continue \
            -A clippy::match_same_arms \
            -A clippy::match_wild_err_arm \
            -A clippy::unnested_or_patterns \
            -A clippy::type_complexity \
            -A clippy::field_reassign_with_default

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6d7ea3ee4000cadd654f6bd50c17380bfa413696 # nextest
      - name: Install Foundry 1.3.2
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'
      - name: Test subcrates
        run: cargo nextest run --workspace --exclude nox-mixnet --exclude nox-sim --exclude nox-test-infra
      - name: Test HTTP E2E integration
        run: cargo test --test http_e2e
      - name: Test FEC E2E integration
        run: cargo test --test fec_e2e
      - name: Test transaction plan
        run: cargo test --test transaction_plan -- --nocapture
      - name: Test durable transaction outbox
        run: cargo test --test transaction_outbox -- --nocapture
      - name: Test chain model exports
        run: cargo test -p nox-core --test chain_exports

  payment-trace-safety:
    name: Payment Trace Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master snapshot
        with:
          toolchain: 1.95.0
      - name: Verify Rust version
        run: rustc --version | grep -F "rustc 1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Foundry 1.3.2
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'
      - name: Install Solidity 0.8.30
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            --output /tmp/solc-static-linux
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  /tmp/solc-static-linux" | sha256sum --check --strict
          sudo install -m 0755 /tmp/solc-static-linux /usr/local/bin/solc
          solc --version | grep -F "0.8.30+commit.73712a01"
      - name: Test committed payment evidence
        run: cargo test --test payment_trace_safety --features dev-node -- --nocapture

  integration:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6d7ea3ee4000cadd654f6bd50c17380bfa413696 # nextest
      - name: Install Foundry 1.3.2
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'
      - name: Install Solidity 0.8.30
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            --output /tmp/solc-static-linux
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  /tmp/solc-static-linux" | sha256sum --check --strict
          sudo install -m 0755 /tmp/solc-static-linux /usr/local/bin/solc
          solc --version | grep -F "0.8.30+commit.73712a01"
      # Every tests/*.rs file of the root crate. Slow suites are #[ignore]d and run nightly
      # from slow-tests.yml.
      - name: Test root integration suites
        run: cargo nextest run -p nox-mixnet --features dev-node --no-fail-fast

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
