name: NOX CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # .cargo/config.toml builds for the local CPU. Runners differ, so cached artifacts built with
  # target-cpu=native can hit SIGILL on another runner. Pin a baseline every runner supports.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify unprivileged runtime image
        run: |
          grep -F "groupadd --gid 10001 nox" Dockerfile
          grep -F "install -d -o 0 -g 0 -m 0755 /etc/nox" Dockerfile
          grep -F "install -d -o 10001 -g 10001 -m 0750 /var/lib/nox" Dockerfile
          grep -F "USER 10001:10001" Dockerfile
          grep -F "useradd --uid 10002 --gid 10002" Dockerfile
          grep -F "install -d -o 10002 -g 10002 -m 0700 /var/lib/nox-kps" Dockerfile
          grep -F 'user: "10002:10002"' crates/nox-kps/deploy/docker-compose.kps.yml
      - name: kps patch revs match the pinned kps release
        run: bash scripts/check-kps-patches.sh
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check RustSec exception deadlines
        run: bash scripts/check-rustsec-exceptions.sh
      - name: Clippy (production code)
        run: cargo clippy --workspace --features dev-node --exclude nox-sim --exclude nox-test-infra --lib --bins -- -D warnings
      - name: Clippy (test & bench code - relaxed for test ergonomics)
        run: |
          cargo clippy --workspace --features dev-node --exclude nox-mixnet --exclude nox-sim --exclude nox-test-infra --tests --benches -- \
            -D warnings \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::semicolon_if_nothing_returned \
            -A clippy::doc_markdown \
            -A clippy::needless_pass_by_value \
            -A clippy::float_cmp \
            -A clippy::bool_to_int_with_if \
            -A clippy::uninlined_format_args \
            -A clippy::redundant_closure_for_method_calls \
            -A clippy::panic \
            -A clippy::match_wildcard_for_single_variants \
            -A clippy::unreadable_literal \
            -A clippy::manual_let_else \
            -A clippy::needless_range_loop \
            -A clippy::explicit_auto_deref \
            -A clippy::explicit_iter_loop \
            -A clippy::vec_init_then_push \
            -A clippy::large_digit_groups \
            -A clippy::io_other_error \
            -A clippy::allow_attributes_without_reason \
            -A clippy::ignore_without_reason \
            -A clippy::manual_assert \
            -A clippy::let_unit_value \
            -A clippy::ignored_unit_patterns
      # The root crate's tests/ and benches/ were never linted before. Same relaxations as above, plus the
      # style lints they still trip; drop these once the files are cleaned up.
      - name: Clippy (root integration tests & benches)
        run: |
          cargo clippy -p nox-mixnet --features dev-node --tests --benches -- \
            -D warnings \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::semicolon_if_nothing_returned \
            -A clippy::doc_markdown \
            -A clippy::needless_pass_by_value \
            -A clippy::float_cmp \
            -A clippy::bool_to_int_with_if \
            -A clippy::uninlined_format_args \
            -A clippy::redundant_closure_for_method_calls \
            -A clippy::panic \
            -A clippy::match_wildcard_for_single_variants \
            -A clippy::unreadable_literal \
            -A clippy::manual_let_else \
            -A clippy::needless_range_loop \
            -A clippy::explicit_auto_deref \
            -A clippy::explicit_iter_loop \
            -A clippy::vec_init_then_push \
            -A clippy::large_digit_groups \
            -A clippy::io_other_error \
            -A clippy::allow_attributes_without_reason \
            -A clippy::ignore_without_reason \
            -A clippy::manual_assert \
            -A clippy::let_unit_value \
            -A clippy::ignored_unit_patterns \
            -A clippy::duration_suboptimal_units \
            -A clippy::default_trait_access \
            -A clippy::needless_continue \
            -A clippy::match_same_arms \
            -A clippy::match_wild_err_arm \
            -A clippy::unnested_or_patterns \
            -A clippy::type_complexity \
            -A clippy::field_reassign_with_default

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6d7ea3ee4000cadd654f6bd50c17380bfa413696 # nextest
      - name: Install Foundry 1.3.2
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'
      # The root crate's tests/ run in the Integration Tests job.
      - name: Test subcrates
        run: cargo nextest run --workspace --exclude nox-mixnet --exclude nox-test-infra
      - name: Test vendored webrtc-sctp
        run: scripts/test-vendored-sctp.sh
      # The nox-kps soaks are #[ignore]d in the default run. Here: 200 sequential
      # 32 KiB exchanges per transport and direction, and 20 large claim bodies
      # (5 MiB) per transport, with zero stalls allowed. The split-process soak
      # is a diagnostic and runs nightly from slow-tests.yml.
      - name: nox-kps soaks (zero stalls)
        run: >
          cargo test --locked -p nox-kps --profile release-kps --test soak --
          --ignored --skip soak_large_split_process --nocapture
        env:
          SOAK_REQUESTS: "200"
          SOAK_STALL_MS: "5000"
          SOAK_LARGE_BYTES: "5242880"
          SOAK_LARGE_REQUESTS: "20"
          SOAK_MAX_STALL_RATE: "0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: nox-kps interop (@kpstreams/quic-client 0.2.1)
        run: |
          cargo build --locked -p nox-kps --bin nox-kps
          cd crates/nox-kps/interop && npm ci && npm test

  payment-trace-safety:
    name: Payment Trace Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master snapshot
        with:
          toolchain: 1.95.0
      - name: Verify Rust version
        run: rustc --version | grep -F "rustc 1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Foundry 1.3.2
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'
      - name: Install Solidity 0.8.30
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            --output /tmp/solc-static-linux
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  /tmp/solc-static-linux" | sha256sum --check --strict
          sudo install -m 0755 /tmp/solc-static-linux /usr/local/bin/solc
          solc --version | grep -F "0.8.30+commit.73712a01"
      - name: Test committed payment evidence
        run: cargo test --test payment_trace_safety --features dev-node -- --nocapture

  integration:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6d7ea3ee4000cadd654f6bd50c17380bfa413696 # nextest
      - name: Install Foundry 1.3.2
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'
      - name: Install Solidity 0.8.30
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            --output /tmp/solc-static-linux
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  /tmp/solc-static-linux" | sha256sum --check --strict
          sudo install -m 0755 /tmp/solc-static-linux /usr/local/bin/solc
          solc --version | grep -F "0.8.30+commit.73712a01"
      # Every tests/*.rs file of the root crate except payment_trace_safety, which has its
      # own required job above.
      - name: Test root integration suites
        run: cargo nextest run -p nox-mixnet --features dev-node --no-fail-fast -E 'not binary(payment_trace_safety)'

  container:
    name: Container image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          load: true
          push: false
          tags: nox:ci
          cache-from: type=gha
      - name: nox-kps container smoke (init, address, check-config, run, healthcheck, restart)
        run: bash scripts/kps-container-smoke.sh nox:ci

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
          # The root package is not a virtual manifest, so without --workspace
          # cargo-deny would check only the nox binary's graph (not nox-kps).
          arguments: --all-features --workspace
