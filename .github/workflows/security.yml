name: Dependency Audit

on:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check RustSec exception deadlines
        run: bash scripts/check-rustsec-exceptions.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          # Install the rust-toolchain.toml channel before cargo-deny runs.
          rust-version: "1.95.0"
          command: check advisories licenses bans sources
          # The root package is not a virtual manifest, so without --workspace
          # cargo-deny would check only the nox binary's graph (not nox-kps).
          arguments: --all-features --workspace
