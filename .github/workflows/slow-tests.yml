name: NOX Slow Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "anvil"
        type: choice
        options:
          - anvil
          - large-payload
          - all
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # .cargo/config.toml builds for the local CPU. Runners differ, so cached artifacts built with
  # target-cpu=native can hit SIGILL on another runner. Pin a baseline every runner supports.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  anvil-tests:
    name: Anvil Tests
    if: >
      github.event_name == 'schedule' ||
      inputs.suite == 'anvil' ||
      inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Verify Rust version
        run: rustc --version | grep -F "rustc 1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'
      - name: Install Solidity 0.8.30
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            --output /tmp/solc-static-linux
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  /tmp/solc-static-linux" | sha256sum --check --strict
          sudo install -m 0755 /tmp/solc-static-linux /usr/local/bin/solc
      - name: Run transaction plan
        run: cargo test --test transaction_plan -- --nocapture
      - name: Run durable transaction outbox
        run: cargo test --test transaction_outbox -- --nocapture
      - name: Run committed payment evidence
        run: cargo test --test payment_trace_safety --features dev-node -- --nocapture
      - name: Run anvil_trace_debug
        run: cargo test --test anvil_trace_debug -- --ignored --nocapture

  large-payload-tests:
    name: Large Payload Tests
    if: >
      github.event_name == 'schedule' ||
      inputs.suite == 'large-payload' ||
      inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Verify Rust version
        run: rustc --version | grep -F "rustc 1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
      - name: Run large-payload suite
        run: cargo test --test large_payload -- --ignored --nocapture
