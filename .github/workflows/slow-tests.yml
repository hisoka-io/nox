name: NOX Slow Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - exit-storage
          - kps-soak
          - compat-mesh
          - all
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # .cargo/config.toml builds for the local CPU. Runners differ, so cached artifacts built with
  # target-cpu=native can hit SIGILL on another runner. Pin a baseline every runner supports.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  # The long horizons of crates/nox-node/tests/exit_storage_bounds.rs. Pull requests run the
  # short ones.
  exit-storage:
    name: Exit Storage Bounds
    if: >
      github.event_name == 'schedule' ||
      inputs.suite == 'exit-storage' ||
      inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
      # libtest exits 0 when --ignored selects nothing, so require a test to have run.
      - name: Run the long storage horizons
        shell: bash
        run: |
          cargo test --locked -p nox-node --test exit_storage_bounds -- --ignored --nocapture \
            | tee "$RUNNER_TEMP/horizons.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/horizons.log"

  # The WebRTC large-claim soak of the Test job (5 MiB, zero stalls allowed) with nox-kps as
  # its own process. The test's 16 MiB default is a manual diagnostic.
  kps-soak:
    name: KPS Split-Process Soak
    if: >
      github.event_name == 'schedule' ||
      inputs.suite == 'kps-soak' ||
      inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
      - name: Run the split-process soak
        shell: bash
        run: |
          cargo test --locked -p nox-kps --profile release-kps --test soak -- \
            --ignored --exact soak_large_split_process --nocapture | tee "$RUNNER_TEMP/soak-split.log"
          grep -q '^test result: ok\. 1 passed' "$RUNNER_TEMP/soak-split.log"
        env:
          SOAK_LARGE_BYTES: "5242880"
          SOAK_LARGE_REQUESTS: "20"
          SOAK_STALL_MS: "5000"
          SOAK_MAX_STALL_RATE: "0"
          SOAK_LOG_DIR: ${{ runner.temp }}/soak-split
      - name: Show soak logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/soak-split/*.log

  # A published client release against a local mesh in which every other node runs the
  # previous release and the rest run this commit.
  compat-mesh:
    name: Mixed-Version Mesh
    if: >
      github.event_name == 'schedule' ||
      inputs.suite == 'compat-mesh' ||
      inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Install Foundry 1.3.2
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build this commit
        run: |
          cargo build --locked --release --bin nox
          cargo build --locked --release -p nox-sim --features dev-node --bin nox_mesh_server
      # The newest release whose nox binary differs from this commit's, built in a target
      # dir of its own. A commit that changes no shipped code builds the latest release's
      # binary, and a mesh of that would run one version. Both builds start from scratch:
      # restored artifacts made the same source compare as different.
      - name: Build the previous release
        run: |
          for tag in $(git for-each-ref --sort=-creatordate --count=2 --format='%(refname:short)' 'refs/tags/v[0-9]*'); do
            git worktree add --detach "$RUNNER_TEMP/src-$tag" "$tag"
            cargo build --locked --release --bin nox \
              --manifest-path "$RUNNER_TEMP/src-$tag/Cargo.toml" \
              --target-dir "$RUNNER_TEMP/previous-target"
            if ! cmp -s "$RUNNER_TEMP/previous-target/release/nox" target/release/nox; then
              echo "previous build: $tag ($(git rev-parse "$tag^{commit}"))"
              cp "$RUNNER_TEMP/previous-target/release/nox" "$RUNNER_TEMP/nox-previous"
              sha256sum "$RUNNER_TEMP/nox-previous" target/release/nox
              exit 0
            fi
            echo "$tag builds the same nox binary as this commit"
          done
          echo "no release with a nox binary different from this commit's" >&2
          exit 1
      - name: Run the mixed mesh
        run: scripts/compat-mesh/run.sh mixed
        env:
          LEGACY_BIN: ${{ runner.temp }}/nox-previous
          WORK: ${{ runner.temp }}/compat-mesh
      - name: Show mesh logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP"/compat-mesh/mixed/*.log
