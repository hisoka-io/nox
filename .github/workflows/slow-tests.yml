name: NOX Slow Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "anvil"
        type: choice
        options:
          - anvil
          - heavy
          - all
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anvil-tests:
    name: Anvil Tests
    if: >
      github.event_name == 'schedule' ||
      inputs.suite == 'anvil' ||
      inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # No bootstrap step: economics_e2e deploys from the committed Hardhat
      # artifacts in abi/ (they carry `bytecode`), and anvil_trace_debug reads
      # no artifacts at all. See scripts/bootstrap-artifacts.sh header.
      - name: Run economics_e2e
        run: cargo test --test economics_e2e --features dev-node -- --ignored --nocapture
      - name: Run anvil_trace_debug
        run: cargo test --test anvil_trace_debug -- --ignored --nocapture

  heavy-tests:
    name: Heavy Tests (Anvil + Node.js)
    if: >
      github.event_name == 'schedule' ||
      inputs.suite == 'heavy' ||
      inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # darkpool-v2 is a PRIVATE repo; actions/checkout only authenticates THIS
      # repo, so the cross-repo clone in bootstrap-artifacts.sh needs its own
      # credential. Requires repo secret DARKPOOL_REPO_TOKEN (PAT or app token
      # with read access to hisoka-io/darkpool-v2).
      - name: Authenticate cross-repo clone
        env:
          DARKPOOL_REPO_TOKEN: ${{ secrets.DARKPOOL_REPO_TOKEN }}
        run: |
          if [ -z "$DARKPOOL_REPO_TOKEN" ]; then
            echo "::error::DARKPOOL_REPO_TOKEN is not set. bootstrap-artifacts.sh cannot clone the private hisoka-io/darkpool-v2 repo."
            exit 1
          fi
          # Scoped to the one private repo so the token is not attached to
          # unrelated github.com fetches.
          git config --global \
            url."https://x-access-token:${DARKPOOL_REPO_TOKEN}@github.com/hisoka-io/darkpool-v2".insteadOf \
            "https://github.com/hisoka-io/darkpool-v2"
      - name: Bootstrap artifacts
        run: ./scripts/bootstrap-artifacts.sh
      - name: Run master_e2e
        run: cargo test --test master_e2e --features dev-node -- --ignored --nocapture 2>&1 | tail -100
      - name: Run native_prover_parity
        run: cargo test --test native_prover_parity -- --ignored --nocapture
