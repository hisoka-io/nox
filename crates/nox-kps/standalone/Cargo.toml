# Workspace root for nox-kps, the KPS entry sidecar for Nox mixnet nodes.
#
# Members:
#   crates/nox-kps — library + `nox-kps` binary
#
# The `kps` crate (ethereum/kps, libs/rust v0.2.2) is a git dependency and only
# builds with the vendored webrtc-rs patches below. Cargo honours [patch] only
# at the workspace root, so the block lives here.
[workspace]
resolver = "2"
members = ["crates/nox-kps"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/hisoka-io/nox-kps"
authors = ["Hisoka IO"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Copied verbatim from the workspace root of ethereum/tor-js (7ac2a60), which
# pins the same kps release; "the gateway crate" there is the nox-kps crate here.
#
# Vendored dependency patches required by KPS — mirror the pinned kps version's
# libs/rust/Cargo.toml exactly (keep in sync when bumping kps). Each rev is an
# orphan branch of the kps repo: verbatim crates.io source plus fix commit(s).
# Only the gateway crate pulls these in, but [patch] must live at the workspace
# root — Cargo ignores it in a member.
#   - webrtc-sctp: read-shutdown drain (webrtc-rs/webrtc#816) + zero-window
#     deadlock on tail-of-burst loss (webrtc-rs/webrtc#822)
#   - webrtc: (1) negotiated-channel accept race — an early inbound message
#     parsed as DCEP kills the accept loop (webrtc-rs/webrtc#821); (2) gate the
#     id-reuse claim on ReadyState::Open so a stale closed channel doesn't
#     shadow a reused SCTP stream id, hanging reads after ~2 streams (kps#4)
[patch.crates-io]
webrtc-sctp = { git = "https://github.com/ethereum/kps.git", rev = "a73a0a8f9e4f76f3b89ba1155562ec836bcf3f3b" }
webrtc = { git = "https://github.com/ethereum/kps.git", rev = "4982e1c1cdce3baa3f703a746367a5e53ca64928" }
