# cargo-deny policy for nox-kps. Run: cargo deny check
#
# Every advisory exception below names the crate path that pulls it in, why it
# does not reach a nox-kps code path, an owner and an expiry date. CI fails once
# an exception expires (scripts/check-advisory-exceptions.sh), so each one is
# revisited, not forgotten.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # bincode 1.x is unmaintained (informational, no vulnerability). Pulled in by
    # webrtc-dtls through the kps crate's WebRTC stack; it (de)serialises DTLS
    # session state locally and never parses network input. Leaves with a kps
    # release that moves dtls off bincode.
    { id = "RUSTSEC-2025-0141", reason = "via kps -> webrtc -> webrtc-dtls; unmaintained notice only; expires=2026-12-01 owner=nox-kps" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # RUSTSEC-2026-0285: the lockfile must resolve rustls 0.23.45 or newer.
    { name = "rustls", version = "<0.23.45" },
    # chacha20 0.10.1 was yanked; 0.10.2 or 0.9.x only.
    { name = "chacha20", version = "=0.10.1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The kps library and its vendored webrtc / webrtc-sctp patches (orphan
# branches of the kps repository; see the workspace Cargo.toml). cargo-deny
# normalises the ".git" suffix, so one entry covers both spellings.
allow-git = ["https://github.com/ethereum/kps"]
