# NOX Configuration Example
#
# Loads: defaults -> this file -> env vars (NOX__ prefix, two underscores).
# Later values override earlier ones. See docs/configuration.md.
#
# For nested fields, __ also separates the section:
#   NOX__NETWORK__MAX_CONNECTIONS=500
#   NOX__RELAYER__MIX_DELAY_MS=200.0
#
# Use env vars for secrets in production.

# ---
# Core Settings
# ---

# Ethereum JSON-RPC endpoint
eth_rpc_url = "http://127.0.0.1:8545"

# Price oracle HTTP URL (for gas profitability calculations)
oracle_url = "http://127.0.0.1:3000"

# Ethereum chain ID (1=Mainnet, 11155111=Sepolia, 421614=Arb Sepolia)
chain_id = 1

# Node role: "relay", "exit", or "full"
#   relay -- Entry/mix relay node (no wallet or chain execution needed)
#   exit  -- Exit node (requires wallet, chain executor, transaction manager)
#   full  -- All capabilities (default, backward compatible)
node_role = "full"

# ---
# Contract Addresses
# ---

# NoxRegistry contract (topology + staking)
registry_contract_address = "0x0000000000000000000000000000000000000000"

# NoxRewardPool contract for execution-scoped fee accounting
nox_reward_pool_address = "0x0000000000000000000000000000000000000000"

# NoxEntryPoint contract for versioned paid execution
nox_entry_point_address = "0x0000000000000000000000000000000000000000"

# ---
# Identity & Keys (use env vars in production)
# ---

# X25519 routing key (hex-encoded, 32 bytes)
# Set via: NOX__ROUTING_PRIVATE_KEY=<hex>
routing_private_key = ""

# Ed25519 P2P identity key (hex-encoded)
# Set via: NOX__P2P_PRIVATE_KEY=<hex>
# If empty, generates ephemeral or loads from p2p_identity_path
p2p_private_key = ""

# Path to persist the P2P identity key
p2p_identity_path = "./data/p2p_id.key"

# Secp256k1 wallet key for TX execution (exit/full nodes only)
# Set via: NOX__ETH_WALLET_PRIVATE_KEY=<hex>
eth_wallet_private_key = ""

# ---
# Networking
# ---

# libp2p listening port
p2p_port = 9000
p2p_listen_addr = "0.0.0.0"

# Prometheus metrics (localhost-only admin API also serves /topology)
metrics_port = 9090

# Public topology API port (0 = disabled)
topology_api_port = 0

# HTTP ingress server port for external packet injection (0 = disabled)
ingress_port = 0

# Seed node URLs for topology bootstrap (faster than on-chain replay)
bootstrap_topology_urls = []

# ---
# Economics
# ---

# Minimum ETH balance in wei before warning (default: 0.01 ETH)
min_gas_balance = "10000000000000000"

# Minimum profit margin (%) for TX execution
min_profit_margin_percent = 10
oracle_cache_ttl_secs = 10
oracle_max_observation_age_secs = 300
oracle_max_future_skew_secs = 30
native_asset_price_id = "ethereum"
native_asset_decimals = 18
gas_limit_buffer_bps = 2000
initial_fee_buffer_bps = 2000
replacement_step_bps = 2000
chain_data_fee_mode = "rpc_gas_estimate_includes_data_fee"
quote_ttl_secs = 30
quote_network_fee_bps = 500
quote_maximum_transaction_gas = 12000000
quote_max_outstanding = 256
quote_max_pending_sponsored_gas = 3072000000
quote_rolling_loss_limit_native = "100000000000000000"
quote_rolling_loss_window_secs = 3600

# ---
# Relay Pipeline
# ---

# Minimum PoW difficulty for incoming packets (0-63)
min_pow_difficulty = 3

# Sled database directory
db_path = "./data/nox_db"

# Block polling interval in seconds
block_poll_interval_secs = 12

# Write the chain observer's scan cursor at most this often, in seconds, and
# again on graceful shutdown. After a crash the observer re-scans up to this
# much history; registry events are safe to replay (0 = write every poll).
chain_cursor_persist_interval_secs = 60

# Re-read every member from the registry and compare the node set with
# topologyFingerprint() and relayerCount() this often (0 = disabled).
# P2P admission only enforces while this check passes.
topology_reconcile_interval_secs = 300

# Max signed broadcast TX size in bytes (default: 128 KB = Ethereum limit)
max_broadcast_tx_size = 131072

# SURB response buffer prune interval in seconds
response_prune_interval_secs = 60

# Skip production validations (testing only)
benchmark_mode = false

# ---
# [network] -- P2P Connection Settings
# ---

[network]
max_connections = 1000
max_connections_per_peer = 2
ping_interval_secs = 15
ping_timeout_secs = 10
gossip_heartbeat_secs = 1
idle_connection_timeout_secs = 3600
session_ttl_secs = 86400          # 24 hours

# Registry admission: "enforce" refuses peers whose libp2p identity is not in a
# registered node's P2P URL, once the node set is verified against the chain
# and the grace period after startup has passed; IP bans and subnet caps are
# refused from the same point. "monitor" only counts, "off" disables the check
# (and keeps IP bans advisory).
peer_admission = "enforce"
peer_admission_grace_secs = 120   # startup delay, and how long a link to a deregistered peer is kept
topology_liveness_window_secs = 60  # /topology reports a member online if seen on P2P within this window
tcp_nodelay = true                # send each Sphinx packet at once (TCP_NODELAY on P2P connections)

# Graduated rate limiting (packets/sec by reputation tier)
[network.rate_limit]
burst_unknown = 50
rate_unknown = 100
burst_trusted = 100
rate_trusted = 200
burst_penalized = 10
rate_penalized = 25
violations_before_disconnect = 5
violation_window_secs = 60
trust_promotion_time_secs = 3600  # 1 hour of good behavior

# Anti-Sybil subnet filtering
[network.connection_filter]
max_per_subnet = 50
subnet_prefix_len = 24            # /24 for IPv4
ipv6_subnet_prefix_len = 48       # /48 for IPv6

# ---
# [relayer] -- Relay Pipeline Settings
# ---

[relayer]
queue_size = 10000
# worker_count defaults to num_cpus (omit to auto-detect)
replay_window = 3600              # Replay tag TTL in seconds
# bloom_persist_interval_secs = 60  # Write the replay filter to disk this often while it changes

# Poisson mix delay (ms). Higher = more anonymity, more latency.
# Set to 0.0 to disable mixing (instant forwarding).
mix_delay_ms = 500.0

# Cover traffic rates (packets/sec). 0.0 = disabled.
cover_traffic_rate = 0.05         # ~1 loop packet every 20s
drop_traffic_rate = 0.05          # ~1 drop packet every 20s
cover_loop_timeout_secs = 60      # loop cover not back in this time counts as lost
# wire_ids = "per_hop"            # "passthrough" keeps packet IDs across hops (benchmarks only)
# surb_formats = "both"           # "v1" turns format 2 replies off

# Fragment reassembly limits
[relayer.fragmentation]
max_pending_bytes = 10485760      # 10 MB total buffer
max_concurrent_messages = 50
timeout_seconds = 300
prune_interval_seconds = 60

# ---
# [http] -- HTTP Proxy (Exit Node)
# ---

[http]
# Domain whitelist. null = open web (with SSRF protection).
# allowed_domains = ["api.example.com"]
allow_private_ips = false
request_timeout_secs = 10
max_response_bytes = 1048576      # 1 MB
# Upstream connection warmth (exit node)
# pool_idle_timeout_secs = 600
# http2_keep_alive_interval_secs = 30
# warm_interval_secs = 60
# warm_recent_secs = 600
# max_cached_hosts = 256

# ---
# [ingress] -- Abuse controls for ingress_port (and CORS on metrics_port)
# ---

[ingress]
# Token bucket per client IP (IPv6 per /64). 0 disables the limit.
rate_limit_per_sec = 100
rate_limit_burst = 400
# Behind a local reverse proxy every connection comes from 127.0.0.1. Name the
# header the proxy sets (its rightmost value is used), e.g. "x-forwarded-for".
# Empty = loopback connections are left to the proxy's own limits.
client_ip_header = ""
# Browser origins allowed by CORS. Empty = any origin.
# cors_allowed_origins = ["https://demo.example.org"]
cors_allowed_origins = []
# Reply claims, protocol v2 (docs/claim-api.md). A reply returned by a claim
# with "retain": true stays re-claimable for this long after its first claim,
# until the client acks it.
claim_retain_grace_ms = 20000
# Longest long-poll ("wait_ms") a retaining claim may ask for; 0 = answer at once.
claim_wait_max_ms = 20000
# Claims that may long-poll at once; beyond it a claim answers at once.
claim_wait_max_concurrent = 256

# Exit dispatch lanes: each payload type has its own queue and concurrency limit.
# Payloads beyond queue_capacity are dropped and counted in
# nox_exit_payloads_dropped_total.
[exit_workers]
paid_concurrency = 4
quote_concurrency = 8
proxy_concurrency = 32
control_concurrency = 16
queue_capacity = 256

# Partial responses waiting for more SURBs at an exit. Filled by anonymous
# clients, so every dimension is capped and entries expire.
[exit_replenishment]
max_pending_responses = 100
max_pending_bytes = 134217728
max_surb_requests = 100
max_surbs_per_request = 512
entry_ttl_secs = 300

# Database maintenance: mined/failed transactions and finished quotes are
# slimmed, then deleted after their retention. Records the node may still act
# on are always kept. See docs/configuration.md.
[storage]
maintenance_interval_secs = 600
prune_terminal_records = true
slim_terminal_transactions_after_secs = 0
terminal_transaction_retention_secs = 604800
expired_quote_retention_secs = 600
terminal_quote_retention_secs = 604800
# Most transaction records one pass changes. Quotes get their own budget,
# derived from quote_max_outstanding and quote_ttl_secs (at least this value).
maintenance_batch_limit = 2000
# Compact at startup when sled blob files exceed this many bytes. 0 = never.
compact_on_start_blob_bytes = 268435456

[[payment_adapters]]
address = "0x0000000000000000000000000000000000000000"
fee_assets = ["0x0000000000000000000000000000000000000000"]
maximum_payment_gas = 4000000

[[tokens]]
address = "0x0000000000000000000000000000000000000000"
symbol = "FEE_ASSET"
decimals = 18
price_id = "fee-asset-oracle-id"
