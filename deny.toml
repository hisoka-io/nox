[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Temporary exceptions are tracked with reachability and migration deadlines in SECURITY.md.
ignore = [
    "RUSTSEC-2025-0141", # expires=2026-12-31 owner=protocol-wire
    "RUSTSEC-2025-0057", # expires=2026-12-31 owner=chain-transport
    "RUSTSEC-2024-0384", # expires=2026-12-31 owner=networking
    "RUSTSEC-2024-0436", # expires=2026-12-31 owner=chain-transport
    "RUSTSEC-2025-0009", # expires=2026-12-31 owner=chain-transport
    "RUSTSEC-2025-0010", # expires=2026-12-31 owner=chain-transport
    "RUSTSEC-2025-0134", # expires=2026-12-31 owner=chain-transport
    "RUSTSEC-2026-0258", # expires=2026-11-30 owner=chain-transport
    "RUSTSEC-2026-0119", # expires=2026-12-15 owner=networking
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "noir_rs"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/zkpassport/noir_rs",
]
