[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Upstream advisories in transitive deps. Tracked, not blocking CI.
ignore = [
    "RUSTSEC-2025-0141", # bincode unmaintained (we use bincode v1, migration to v2 is non-trivial)
    "RUSTSEC-2026-0007", # bytes integer overflow (in ethers transitive dep, awaiting upstream fix)
    "RUSTSEC-2025-0057", # fxhash unmaintained (transitive via ethers)
    "RUSTSEC-2024-0384", # instant unmaintained (transitive via ethers/libp2p)
    "RUSTSEC-2024-0436", # paste unmaintained (transitive)
    "RUSTSEC-2025-0009", # aes panic on overflow check (transitive, low practical risk)
    "RUSTSEC-2025-0010", # ring <0.17 unmaintained (transitive via ethers/rustls)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (transitive)
    "RUSTSEC-2026-0009", # DoS via stack exhaustion (transitive dep)
    "RUSTSEC-2026-0049", # webpki CRL matching logic (transitive via noir_rs, limited impact)
    "RUSTSEC-2026-0097", # rand unsound with custom logger + rand::rng() (we use tracing, not a custom logger)
    # --- rustls-webpki 0.101.7, pinned by ethers -> rustls 0.21. Fixed in
    # 0.103.12+, which ethers cannot reach without a major rustls bump. The
    # newer rustls-webpki in the tree is already updated to 0.103.15.
    "RUSTSEC-2026-0098", # webpki accepted URI name constraints (transitive via ethers/rustls 0.21)
    "RUSTSEC-2026-0099", # webpki accepted wildcard name constraints (transitive via ethers/rustls 0.21)
    "RUSTSEC-2026-0104", # webpki CRL parsing panic (transitive via ethers/rustls 0.21)
    # --- h2 0.3.27 via ethers -> hyper 0.14. Fix lands in 0.4.16; the 0.3 line
    # has none. Requires migrating ethers off hyper 0.14.
    "RUSTSEC-2026-0258", # h2 unbounded empty DATA frames (transitive via ethers/hyper 0.14)
    # --- hickory-proto 0.24.4 via libp2p-dns 0.41. Fix is 0.26.1, which needs a
    # libp2p major upgrade.
    "RUSTSEC-2026-0119", # hickory-proto O(n^2) name compression (transitive via libp2p 0.53)
    # --- core2 via multihash <- libp2p-core 0.41. Same libp2p upgrade.
    "RUSTSEC-2026-0105", # core2 unmaintained and yanked (transitive via libp2p 0.53)
    # --- im and its deps via noirc_evaluator, pinned to a noir git rev. Moving
    # off it means changing the proving toolchain.
    "RUSTSEC-2026-0247", # bitmaps unmaintained (transitive via noir -> im)
    "RUSTSEC-2026-0248", # im unmaintained (transitive via noir)
    "RUSTSEC-2026-0251", # sized-chunks unmaintained (transitive via noir -> im)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "noir_rs"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/zkpassport/noir_rs",
]
