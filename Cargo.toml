[workspace]
members = [
    ".",
    "crates/nox-core",
    "crates/nox-crypto",
    "crates/nox-client",
    "crates/nox-node",
    "crates/nox-test-infra",
    "crates/nox-oracle",
    "crates/nox-sim",
    "crates/nox-kps",
]
# Vendored dependency sources used through [patch.crates-io] (vendor/README.md).
exclude = ["vendor"]

[workspace.package]
version = "0.4.0-rc.6"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0.17"
tracing = "0.1"
async-trait = "0.1"
rand = "0.8"
hex = "0.4"
ethers = { version = "2.0", default-features = false, features = ["ws", "ipc", "openssl", "abigen"] }
sha2 = { version = "0.10", features = ["asm"] }
parking_lot = "0.12"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
unused_self = "allow"
unused_async = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
return_self_not_must_use = "allow"
doc_link_with_quotes = "allow"
manual_let_else = "allow"

[package]
name = "nox-mixnet"
version.workspace = true
edition = "2021"
rust-version = "1.95"
authors = ["Hisoka IO"]
description = "Sphinx mixnet relay node for Ethereum"
license = "Apache-2.0"
repository = "https://github.com/hisoka-io/nox"

[[bin]]
name = "nox"
path = "src/main.rs"

[features]
default = []
mock-prover = []
dev-node = ["nox-node/dev-node"]
hop-metrics = ["nox-node/hop-metrics", "nox-crypto/hop-metrics"]

[dependencies]
tokio = { version = "1.36", features = ["full", "tracing"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1.0"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
clap = { version = "4.4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
x25519-dalek = { version = "2.0.0", features = ["static_secrets", "serde"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
ethers = { version = "2.0", default-features = false, features = ["ws", "ipc", "openssl", "abigen"] }
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "request-response", "identify", "ping", "macros", "tokio", "cbor"] }
axum = "0.7"
tempfile = "3.10"
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
nox-node = { path = "crates/nox-node", version = "0.4.0-rc.6" }

nox-oracle = { path = "crates/nox-oracle", version = "0.4.0-rc.6" }

[dev-dependencies]
nox-core = { path = "crates/nox-core", version = "0.4.0-rc.6" }

nox-crypto = { path = "crates/nox-crypto", version = "0.4.0-rc.6" }

nox-client = { path = "crates/nox-client", version = "0.4.0-rc.6" }

mockall = "0.12"
sha2 = { workspace = true }
tempfile = "3.10"
anyhow = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
ethers = { version = "2.0", default-features = false, features = ["ws", "ipc", "openssl", "abigen"] }
criterion = { version = "0.5", features = ["async_tokio"] }
ethers-solc = "2.0"
wiremock = "0.6"
reqwest = { version = "0.12", features = ["json"] }
tokio-util = { version = "0.7", features = ["rt"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
curve25519-dalek = { version = "4.1", features = ["rand_core"] }
hmac = "0.12"

[lints]
workspace = true

[[bench]]
name = "replay_bench"
harness = false

[[bin]]
name = "price_server"
path = "src/bin/price_server.rs"

[[bench]]
name = "exit_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1

# Release profile for the nox-kps binary (built with `--profile release-kps`). It keeps
# unwinding, as the stock kps gateway does: a panic inside one connection's task in the
# young webrtc-rs stack then ends that connection only, not every client's. The node
# binaries keep `panic = "abort"`; nox-kps runs as its own process either way.
[profile.release-kps]
inherits = "release"
panic = "unwind"

# Vendored dependency patches required by the `kps` crate (nox-kps), copied from the
# workspace root of ethereum/tor-js (7ac2a60), which pins the same kps release. They
# mirror the pinned kps version's libs/rust/Cargo.toml exactly (keep in sync when bumping
# kps; scripts/check-kps-patches.sh checks it). Each rev is an orphan branch of the kps
# repo: verbatim crates.io source plus fix commit(s). Only nox-kps pulls these crates
# in, but Cargo honours [patch] only at the workspace root.
#   - webrtc-sctp: read-shutdown drain (webrtc-rs/webrtc#816) + zero-window
#     deadlock on tail-of-burst loss (webrtc-rs/webrtc#822). Vendored at that
#     rev in vendor/webrtc-sctp with nox's sender tuning on top (larger initial
#     window, 1 s initial RTO; vendor/README.md). scripts/check-kps-patches.sh
#     checks the vendored base rev against kps.
#   - webrtc: (1) negotiated-channel accept race: an early inbound message
#     parsed as DCEP kills the accept loop (webrtc-rs/webrtc#821); (2) gate the
#     id-reuse claim on ReadyState::Open so a stale closed channel does not
#     shadow a reused SCTP stream id, hanging reads after ~2 streams (kps#4)
[patch.crates-io]
webrtc-sctp = { path = "vendor/webrtc-sctp" }
# webrtc-ice 0.14.0 from crates.io with one change for the kps server's ICE-lite
# agent: an authenticated connectivity check selects the pair at once instead of
# waiting for USE-CANDIDATE, so DTLS starts on the browser's first ClientHello
# (vendor/README.md).
webrtc-ice = { path = "vendor/webrtc-ice" }
webrtc = { git = "https://github.com/ethereum/kps.git", rev = "4982e1c1cdce3baa3f703a746367a5e53ca64928" }
